source: |2

  variable a0 \ lowest 9 digits
  variable a1 \ next 9 digits
  variable a2 \ highest digits

  variable b0
  variable b1
  variable b2

  variable r0
  variable r1
  variable r2

  \ Большие константы (1e9, 1e8) не помещаются в 24-битный знаковый
  \ аргумент инструкции, поэтому собираем их из более мелких частей
  \ во время исполнения (аналог hi/lo приёма в RISC).
  : 1e9 1000 1000 * 1000 * ;          \ 10^9 = 1 000 000 000
  : 1e8 10000 10000 * ;               \ 10^8 = 100 000 000
  : 9e8+ 1e9 1 - ;                    \ 999 999 999

  : add64
      a0 @ b0 @ + r0 !
      a1 @ b1 @ + r1 !
      a2 @ b2 @ + r2 !
      
      r0 @ 1e9 < not if
          r0 @ 1e9 - r0 !
          r1 @ 1 + r1 !
      endif
      
      r1 @ 1e9 < not if
          r1 @ 1e9 - r1 !
          r2 @ 1 + r2 !
      endif
  ;

  variable num
  variable divisor
  variable started
  variable pad_zeros

  : print_num_padded \ n pad --
      pad_zeros !
      dup 0 = if
          drop 
          pad_zeros @ 1 = if
              48 emit 48 emit 48 emit 48 emit 48 emit 48 emit 48 emit 48 emit 48 emit
          else
              48 emit
          endif
      else
          num !
          1e8 divisor !
          0 started !
          begin
              divisor @ 0 = if
                  1 \ exit
              else
                  num @ divisor @ / 
                  dup 0 > started @ 1 = or pad_zeros @ 1 = or if
                      1 started !
                      dup 48 + emit
                      divisor @ * num @ swap - num !
                  else
                      drop
                  endif
                  divisor @ 10 / divisor !
                  0 \ continue
              endif
          until
      endif
  ;

  : print64
      r2 @ 0 > if
          r2 @ 0 print_num_padded
          r1 @ 1 print_num_padded
          r0 @ 1 print_num_padded
      else
          r1 @ 0 > if
              r1 @ 0 print_num_padded
              r0 @ 1 print_num_padded
          else
              r0 @ 0 print_num_padded
          endif
      endif
      10 emit
  ;

  9e8+ a0 !
  9e8+ a1 !
  0 a2 !

  2 b0 !
  0 b1 !
  0 b2 !

  add64
  print64

