source: |2

  variable swapped
  variable ptr
  variable val1
  variable val2

  : sort_string \ addr --
      begin
          0 swapped !
          dup ptr !
          begin
              ptr @ @ 0 = if
                  1 \ exit inner
              else
                  ptr @ 1 + @ 0 = if
                      1 \ exit inner
                  else
                      ptr @ @ val1 !
                      ptr @ 1 + @ val2 !
                      val1 @ val2 @ > if
                          val2 @ ptr @ !
                          val1 @ ptr @ 1 + !
                          1 swapped !
                      endif
                      ptr @ 1 + ptr !
                      0 \ continue inner
                  endif
              endif
          until
          swapped @ 0 =
      until
      drop
  ;

  : print_string
      begin
          dup @
          dup 0 = if
              drop drop 1
          else
              emit
              1 +
              0
          endif
      until
  ;

  "zyxwvutsrqponmlkjihgfedcba" 
  dup sort_string
  print_string

