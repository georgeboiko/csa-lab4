source: |2

  variable buf_ptr
  variable input_done

  :isr input_handler
      key dup 0 = if
          drop
          buf_ptr @ 0 swap !
          1 input_done !
      else
          buf_ptr @ !
          buf_ptr @ 1 + buf_ptr !
      endif
  ;

  variable swapped
  variable ptr
  variable val1
  variable val2

  : sort_nums \ addr --
      begin
          0 swapped !
          dup ptr !
          begin
              ptr @ @ 0 = if
                  1
              else
                  ptr @ 1 + @ 0 = if
                      1
                  else
                      ptr @ @ val1 !
                      ptr @ 1 + @ val2 !
                      val1 @ val2 @ > if
                          val2 @ ptr @ !
                          val1 @ ptr @ 1 + !
                          1 swapped !
                      endif
                      ptr @ 1 + ptr !
                      0
                  endif
              endif
          until
          swapped @ 0 =
      until
      drop
  ;

  : print_nums \ addr --
      begin
          dup @
          dup 0 = if
              drop drop 1
          else
              emit
              1 +
              0
          endif
      until
  ;

  1000 buf_ptr !
  0 input_done !
  begin
      input_done @ 1 =
  until
  1000 sort_nums
  1000 print_nums

