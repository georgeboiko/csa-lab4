source: |2

  variable sum
  variable i

  variable num
  variable divisor
  variable started

  : print_num \ n --
      dup 0 = if
          drop 48 emit \ '0'
      else
          num !
          1000000000 divisor !
          0 started !
          begin
              divisor @ 0 = if
                  1 \ exit
              else
                  num @ divisor @ / 
                  dup 0 > started @ 1 = or if
                      1 started !
                      dup 48 + emit
                      divisor @ * num @ swap - num !
                  else
                      drop
                  endif
                  divisor @ 10 / divisor !
                  0 \ continue
              endif
          until
      endif
  ;

  : prob1
      0 sum !
      1 i !
      begin
          i @ 1000 = if
              1 \ exit
          else
              i @ 3 mod 0 = 
              i @ 5 mod 0 = 
              or if
                  sum @ i @ + sum !
              endif
              i @ 1 + i !
              0 \ continue
          endif
      until
      sum @
  ;

  prob1 print_num

