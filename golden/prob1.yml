source: |2

  variable best
  variable i
  variable j
  variable prod
  variable rev
  variable tmp
  variable num
  variable divisor
  variable started

  : print_num
      dup 0 = if
          drop 48 emit
      else
          num !
          1000000 divisor !
          0 started !
          begin
              divisor @ 0 = if
                  1
              else
                  num @ divisor @ /
                  dup 0 > started @ 1 = or if
                      1 started !
                      dup 48 + emit
                      divisor @ * num @ swap - num !
                  else
                      drop
                  endif
                  divisor @ 10 / divisor !
                  0
              endif
          until
      endif
  ;

  : is-palindrome
      prod !
      0 rev !
      prod @ tmp !
      begin
          tmp @ 10 mod rev @ 10 * + rev !
          tmp @ 10 / tmp !
          tmp @ 0 =
      until
      rev @ prod @ =
  ;

  : prob1
      0 best !
      999 i !
      begin
          i @ 999 * best @ > if
              999 j !
              begin
                  j @ i @ < if
                      1
                  else
                      i @ j @ * best @ > if
                          i @ j @ * prod !
                          prod @ is-palindrome if
                              prod @ best !
                          endif
                      endif
                      j @ 1 - j !
                      j @ i @ 1 - =
                  endif
              until
              i @ 1 - i !
              0
          else
              1
          endif
      until
      best @
  ;

  prob1 print_num

