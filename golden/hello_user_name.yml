source: |2

  variable buf_ptr
  variable name_ready

  :isr input_handler
      key dup 0 = if
          drop
          buf_ptr @ 0 swap ! \ null terminator at current ptr
          1 name_ready !
      else
          dup 10 = if \ newline
              drop
              buf_ptr @ 0 swap ! \ null terminator
              1 name_ready !
          else
              buf_ptr @ ! \ store char at buf_ptr
              buf_ptr @ 1 + buf_ptr ! \ increment buf_ptr
          endif
      endif
  ;

  : print_string
      begin
          dup @
          dup 0 = if
              drop drop 1
          else
              emit
              1 +
              0
          endif
      until
  ;

  1000 buf_ptr !
  0 name_ready !
  "What is your name?" print_string
  10 emit
  begin
      name_ready @ 1 =
  until
  "Hello, " print_string
  1000 print_string
  33 emit
  10 emit

