source: |2

  variable has_data
  variable eof
  variable current_char

  :isr input_handler
      key dup 0 = if
          drop
          1 eof !
      else
          current_char !
          1 has_data !
      endif
  ;

  : print_string
      begin
          dup @
          dup 0 = if
              drop drop 1
          else
              emit
              1 +
              0
          endif
      until
  ;

  : read_name
      1000 \ buffer address
      begin
          has_data @ 1 = if
              current_char @ 
              dup 10 = if \ newline
                  drop
                  0 swap ! \ null terminator
                  0 has_data !
                  1 \ exit loop
              else
                  over ! \ store char in buffer
                  1 + \ increment buffer address
                  0 has_data !
                  0
              endif
          else
              eof @ 1 = if
                  0 swap ! \ null terminator
                  1
              else
                  0
              endif
          endif
      until
  ;

  "What is your name?" print_string
  10 emit
  read_name
  "Hello, " print_string
  1000 print_string
  33 emit \ '!'
  10 emit

