source: |2

  variable buffer
  variable has_data
  variable eof

  :isr input_handler
      key dup 0 = if
          drop
          1 eof !
      else
          buffer !
          1 has_data !
      endif
  ;

  : cat
      begin
          has_data @ 1 = if
              buffer @ emit
              0 has_data !
          endif
          eof @ 1 =
      until
  ;

  cat

