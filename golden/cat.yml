source: |2

  \ Lock-free SPSC ring buffer:
  \   - head пишет только ISR, tail пишет только main
  \   - has_data вычисляется как head != tail (без общего флага → нет гонки)
  \   - buffer лежит по адресам 1000..1015 (размер 16, маска 15)
  variable head
  variable tail
  variable eof

  :isr input_handler
      key dup 0 = if
          drop
          1 eof !
      else
          \ ( char -- )  записать в buffer[head], head = (head+1) & 15
          head @ 1000 + !
          head @ 1 + 15 and head !
      endif
  ;

  : cat
      begin
          head @ tail @ = if
              \ буфер пуст — выходим только если уже виден EOF
              eof @ 1 =
          else
              tail @ 1000 + @ emit
              tail @ 1 + 15 and tail !
              0
          endif
      until
  ;

  cat

